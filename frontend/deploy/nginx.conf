# Neora nginx (Docker, --network host): TLS here, /api/ -> backend on 127.0.0.1:3000.
# Certificates: /etc/nginx/ssl. Proxy secret: /etc/nginx/snippets/neora-proxy-secret.conf.
# Both directories are mounted read-only into the container (see "Web app" in the root README.md).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    server_name _;

    root /var/www/neora;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/plain image/svg+xml;

    location = /index.html { expires -1; }
    location /config/ { expires -1; }
    location ~* \.(css|js)$ { expires 1h; }
    location ~ ^/(deploy/|README\.md|Dockerfile|\.dockerignore) { return 404; }
    location ~ /\. { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Create this file on the server only; never commit it.
        include /etc/nginx/snippets/neora-proxy-secret.conf;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / { try_files $uri $uri/ =404; }
}
